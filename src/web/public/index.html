<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenLLM</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--bg2:#151515;--bg3:#1c1c1c;--border:#2a2a2a;
  --text:#e8e8e8;--dim:#888;--muted:#555;--accent:#6366f1;
  --green:#22c55e;--blue:#3b82f6;--yellow:#f59e0b;--red:#ef4444;
  --font:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;
  --mono:'SF Mono','Fira Code',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Layout ── */
#app{display:flex;height:100%}

/* ── Sidebar Rail ── */
.rail{width:56px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;flex-shrink:0}
.rail-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--dim);border-radius:8px;cursor:pointer;font-size:16px;margin-bottom:4px}
.rail-btn:hover{background:var(--bg3);color:var(--text)}
.rail-sep{width:24px;height:1px;background:var(--border);margin:6px 0}
.rail-spacer{flex:1}
.proj-av{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer;margin-bottom:6px;transition:transform .15s}
.proj-av:hover{transform:scale(1.1)}
.proj-av.active{outline:2px solid var(--text);outline-offset:2px}

/* ── Project Panel ── */
.panel{width:0;overflow:hidden;background:var(--bg2);border-right:1px solid var(--border);transition:width .2s ease-out;flex-shrink:0}
.panel.open{width:260px}
.panel-inner{width:260px;padding:16px;display:flex;flex-direction:column;height:100%}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.panel-title{font-size:14px;font-weight:600}
.panel-close{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px}
.sess-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:13px;transition:background .15s}
.sess-item:hover{background:var(--bg3)}
.sess-item .t{font-weight:500;margin-bottom:2px}
.sess-item .m{font-size:11px;color:var(--dim)}
.panel-new{width:100%;margin-top:auto;padding:10px;border-radius:8px;border:1px dashed var(--border);background:none;color:var(--dim);cursor:pointer;font-size:13px}
.panel-new:hover{border-color:var(--accent);color:var(--text)}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── HOME ── */
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;overflow-y:auto}
#home.hide{display:none}
.hero{text-align:center;margin-bottom:40px}
.hero-logo{width:64px;height:64px;border-radius:16px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;margin-bottom:16px}
.hero h1{font-size:28px;font-weight:700;margin-bottom:6px}
.hero p{color:var(--dim);font-size:14px}
.status-row{display:flex;gap:12px;justify-content:center;margin-top:16px}
.badge{padding:4px 12px;border-radius:99px;font-size:12px;border:1px solid var(--border);color:var(--dim)}
.home-cards{width:100%;max-width:520px}
.home-cards-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:12px}
.hcard{padding:14px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;margin-bottom:8px;transition:border-color .15s}
.hcard:hover{border-color:var(--accent)}
.hcard .t{font-size:14px;font-weight:500;margin-bottom:4px}
.hcard .m{font-size:12px;color:var(--dim)}
.new-btn{width:100%;max-width:520px;margin-top:20px;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.new-btn:hover{background:#818cf8}

/* ── CHAT ── */
#chat{flex:1;display:none;flex-direction:column;overflow:hidden}
#chat.show{display:flex}

/* Chat app header */
.chat-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.chat-back{background:none;border:none;color:var(--dim);cursor:pointer;width:32px;height:32px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px}
.chat-back span{display:block;height:2px;background:var(--dim);border-radius:2px;width:20px}
.chat-icons{display:flex;gap:8px}
.chat-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--dim);position:relative}
.green-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--green);border-radius:50%}

/* Tabs */
.tabs{display:flex;flex-shrink:0}
.tab{flex:1;text-align:center;padding:10px 0;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:600}

/* Session pane */
.sess-pane{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.sess-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sess-title-text{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--dim);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Messages */
.msg{max-width:85%;animation:fadein .15s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-user{align-self:flex-end;background:var(--accent);color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px;font-size:14px}
.msg-bot{align-self:flex-start;font-size:14px;line-height:1.65}
.msg-bot code{font-family:var(--mono);font-size:12px;background:var(--bg3);padding:2px 5px;border-radius:4px}
.msg-bot pre{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0}
.msg-bot pre code{background:none;padding:0}

/* Tool card */
.tcard{align-self:flex-start;max-width:85%;background:var(--bg2);border-radius:8px;border-left:3px solid var(--green);overflow:hidden}
.tcard-hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.tcard-name{font-size:12px;font-weight:600;flex:1}
.tcard-st{font-size:11px;color:var(--dim)}
.tcard-body{display:none;padding:0 12px 10px;font-family:var(--mono);font-size:12px;color:var(--dim);white-space:pre-wrap;max-height:200px;overflow-y:auto}
.tcard.open .tcard-body{display:block}

/* Permission card */
.pcard{align-self:flex-start;max-width:85%;background:#1a1a2e;border-radius:8px;border-left:3px solid var(--yellow);padding:12px 14px}
.pcard-title{font-size:13px;font-weight:600;color:var(--yellow);margin-bottom:6px}
.pcard-desc{font-size:12px;color:var(--dim);margin-bottom:10px;font-family:var(--mono)}
.pcard-btns{display:flex;gap:8px}
.pbtn{padding:6px 16px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer}
.pbtn-ok{background:var(--green);color:#fff}
.pbtn-no{background:#2a1a1a;color:var(--red);border:1px solid #3a2020}

/* Changes pane */
.changes-pane{flex:1;display:none;overflow-y:auto;padding:40px 14px;text-align:center;color:var(--muted);font-size:14px}

/* Composer */
.composer{flex-shrink:0;background:var(--bg);padding:8px 12px 10px;border-top:1px solid var(--border)}
.comp-box{background:#1a1a1a;border:1px solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.comp-box textarea{background:none;border:none;outline:none;color:var(--text);font-size:15px;resize:none;width:100%;font-family:inherit;line-height:1.4;min-height:22px;max-height:120px}
.comp-row{display:flex;justify-content:space-between;align-items:center}
.comp-attach{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:20px;cursor:pointer}
.comp-send{width:34px;height:34px;background:var(--dim);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.comp-send:hover{background:var(--text)}
.toolbar{display:flex;align-items:center;padding:0 2px}
.tool-item{padding:4px 8px;font-size:13px;color:var(--dim);border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:4px}
.tool-item:hover{background:#1a1a1a}
.tool-sep{color:var(--border);font-size:16px;padding:0 2px}
.model-badge{width:14px;height:14px;background:#e8d5b0;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:#5a3e00;font-weight:900}
.tool-shield{margin-left:auto;color:var(--muted);padding:4px 8px;cursor:pointer}
.tok-count{font-size:11px;color:var(--muted);margin-left:auto}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text);z-index:999;animation:fadein .2s}

/* Mobile */
@media(max-width:700px){.rail{display:none}.panel{display:none}}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar Rail -->
  <div class="rail">
    <button class="rail-btn" title="Menu" onclick="togglePanel()">&#9776;</button>
    <div class="rail-sep"></div>
    <div class="rail-btn" style="font-weight:800;color:var(--accent)">OL</div>
    <div class="rail-sep"></div>
    <div id="avatars"></div>
    <button class="rail-btn" title="Add project" onclick="addProject()">+</button>
    <div class="rail-spacer"></div>
    <div class="rail-sep"></div>
    <button class="rail-btn" title="Settings">&#9881;</button>
    <button class="rail-btn" title="Help">?</button>
  </div>

  <!-- Project Panel -->
  <div class="panel" id="panel">
    <div class="panel-inner">
      <div class="panel-head">
        <span class="panel-title" id="panel-name">Project</span>
        <button class="panel-close" onclick="closePanel()">&times;</button>
      </div>
      <div id="panel-sessions"></div>
      <button class="panel-new" onclick="newSession()">+ New Session</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <!-- HOME VIEW -->
    <div id="home">
      <div class="hero">
        <div class="hero-logo">OL</div>
        <h1>OpenLLM</h1>
        <p>Local-first LLM development platform</p>
        <div class="status-row">
          <span class="badge" id="status-badge">&#9679; Offline</span>
          <span class="badge" id="provider-badge">&#9679; No provider</span>
        </div>
      </div>
      <div class="home-cards">
        <div class="home-cards-title">Recent Sessions</div>
        <div id="home-list"></div>
      </div>
      <button class="new-btn" onclick="newSession()">New Session</button>
    </div>

    <!-- CHAT VIEW -->
    <div id="chat">
      <!-- App Header -->
      <div class="chat-hdr">
        <button class="chat-back" onclick="goHome()" title="Back">
          <span></span><span></span><span></span>
        </button>
        <div class="chat-icons">
          <div class="chat-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            <span class="green-dot"></span>
          </div>
          <div class="chat-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          </div>
        </div>
      </div>

      <!-- Tab Bar (Session / Changes) -->
      <div class="tabs">
        <div class="tab on" onclick="switchTab('session',this)">Session</div>
        <div class="tab" onclick="switchTab('changes',this)">Changes</div>
      </div>

      <!-- Session Tab -->
      <div class="sess-pane" id="sess-pane">
        <div class="sess-title-row">
          <span class="sess-title-text" id="chat-title">New Session</span>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="spinner" id="chat-spin" style="display:none"></div>
            <span style="color:var(--dim);font-size:18px;cursor:pointer">···</span>
          </div>
        </div>
        <div id="messages" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>

      <!-- Changes Tab -->
      <div class="changes-pane" id="changes-pane">No changes in this session yet.</div>

      <!-- Composer -->
      <div class="composer">
        <div class="comp-box">
          <textarea id="input" rows="1" placeholder="Ask anything..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
          <div class="comp-row">
            <div class="comp-attach">+</div>
            <button class="comp-send" onclick="send()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>
        </div>
        <div class="toolbar">
          <div class="tool-item">Plan <span style="font-size:10px;opacity:.6">&#9662;</span></div>
          <span class="tool-sep">|</span>
          <div class="tool-item"><span class="model-badge">O</span> Default <span style="font-size:10px;opacity:.6">&#9662;</span></div>
          <span class="tool-sep">|</span>
          <div class="tool-item">Code <span style="font-size:10px;opacity:.6">&#9662;</span></div>
          <span class="tok-count" id="tok"></span>
          <div class="tool-shield">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ── State ── */
const projects = [
  {id:'p1',name:'MyApp',short:'MA',color:'#6b1f4a',sessions:[
    {id:'s1',title:'Fix auth middleware',time:'2 min ago',msgs:3},
    {id:'s2',title:'Add user dashboard',time:'1 hour ago',msgs:12},
    {id:'s3',title:'Refactor DB schema',time:'3 hours ago',msgs:8},
  ]},
  {id:'p2',name:'API Server',short:'AS',color:'#1a5f4a',sessions:[
    {id:'s4',title:'Setup Express routes',time:'30 min ago',msgs:5},
    {id:'s5',title:'Rate limiting',time:'2 days ago',msgs:20},
  ]},
];
let activeProj = null;
let view = 'home'; // 'home' | 'chat'
let ws = null;
let streaming = false;
let streamBuf = '';

/* ── DOM ── */
const $=s=>document.querySelector(s);
const homeEl=$('#home'), chatEl=$('#chat');
const avatarsEl=$('#avatars'), panelEl=$('#panel');
const panelName=$('#panel-name'), panelSessions=$('#panel-sessions');
const homeList=$('#home-list');
const chatTitle=$('#chat-title'), chatSpin=$('#chat-spin');
const sessPaneEl=$('#sess-pane'), changesPaneEl=$('#changes-pane');
const messagesEl=$('#messages'), inputEl=$('#input'), tokEl=$('#tok');

/* ── Render Avatars ── */
function renderAvatars(){
  avatarsEl.innerHTML='';
  projects.forEach(p=>{
    const d=document.createElement('div');
    d.className='proj-av'+(activeProj===p.id?' active':'');
    d.textContent=p.short;
    d.style.background=p.color;
    d.title=p.name;
    d.onclick=()=>togglePanel(p.id);
    avatarsEl.appendChild(d);
  });
}

/* ── Panel ── */
function togglePanel(pid){
  if(activeProj===pid && panelEl.classList.contains('open')){
    closePanel(); return;
  }
  activeProj=pid||projects[0]?.id;
  const p=projects.find(x=>x.id===activeProj);
  if(!p)return;
  panelName.textContent=p.name;
  panelSessions.innerHTML='';
  p.sessions.forEach(s=>{
    const el=document.createElement('div');
    el.className='sess-item';
    el.innerHTML=`<div class="t">${esc(s.title)}</div><div class="m">${s.time} · ${s.msgs} msgs</div>`;
    el.onclick=()=>{openChat(s.title);closePanel()};
    panelSessions.appendChild(el);
  });
  panelEl.classList.add('open');
  renderAvatars();
}
function closePanel(){activeProj=null;panelEl.classList.remove('open');renderAvatars()}

/* ── Home List ── */
function renderHome(){
  homeList.innerHTML='';
  const all=[];
  projects.forEach(p=>p.sessions.forEach(s=>all.push({...s,proj:p.name})));
  all.slice(0,6).forEach(s=>{
    const el=document.createElement('div');
    el.className='hcard';
    el.innerHTML=`<div class="t">${esc(s.title)}</div><div class="m"><span>${esc(s.proj)}</span> · ${s.time} · ${s.msgs} msgs</div>`;
    el.onclick=()=>openChat(s.title);
    homeList.appendChild(el);
  });
}

/* ── View Switching ── */
function openChat(title){
  view='chat';
  homeEl.classList.add('hide');
  chatEl.classList.add('show');
  chatTitle.textContent=title||'New Session';
  messagesEl.innerHTML='';
  streamBuf='';streaming=false;
  inputEl.focus();
}
function goHome(){
  view='home';
  chatEl.classList.remove('show');
  homeEl.classList.remove('hide');
}
function newSession(){openChat('New Session')}

/* ── Tabs ── */
function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  if(name==='session'){sessPaneEl.style.display='flex';changesPaneEl.style.display='none'}
  else{sessPaneEl.style.display='none';changesPaneEl.style.display='block'}
}

/* ── Composer ── */
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function send(){
  const txt=inputEl.value.trim();
  if(!txt)return;
  appendMsg('user',txt);
  inputEl.value='';inputEl.style.height='auto';
  if(ws&&ws.readyState===1){ws.send(JSON.stringify({type:'message',content:txt}))}
  else{setTimeout(()=>appendMsg('bot','Echo: '+txt),300)}
}

/* ── Messages ── */
function appendMsg(role,text){
  const el=document.createElement('div');
  el.className='msg msg-'+(role==='user'?'user':'bot');
  el.innerHTML=role==='user'?esc(text):renderMd(text);
  messagesEl.appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'end'});
}

function renderMd(t){
  if(typeof marked!=='undefined'){try{return marked.parse(t)}catch(e){}}
  return esc(t).replace(/\n/g,'<br>');
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ── WebSocket ── */
function connectWS(){
  try{
    const proto=location.protocol==='https:'?'wss:':'ws:';
    ws=new WebSocket(proto+'//'+location.host+'/ws');
    ws.onopen=()=>{$('#status-badge').textContent='● Connected'};
    ws.onclose=()=>{$('#status-badge').textContent='● Offline';ws=null};
    ws.onerror=()=>{ws=null};
    ws.onmessage=(e)=>{
      try{const m=JSON.parse(e.data);handleWS(m)}catch(er){}
    };
  }catch(e){}
}
function handleWS(m){
  if(m.type==='token'){
    if(!streaming){streaming=true;streamBuf='';appendMsg('bot','');}
    streamBuf+=m.content;
    const last=messagesEl.lastElementChild;
    if(last)last.innerHTML=renderMd(streamBuf);
  }else if(m.type==='done'){
    streaming=false;
    if(m.usage&&tokEl)tokEl.textContent=(m.usage.input_tokens||0)+' in / '+(m.usage.output_tokens||0)+' out';
  }else if(m.type==='error'){
    appendMsg('bot','Error: '+m.message);
  }else if(m.type==='tool_use'){
    const card=document.createElement('div');
    card.className='tcard';card.id='tc_'+m.id;
    card.innerHTML=`<div class="tcard-hdr" onclick="this.parentElement.classList.toggle('open')"><span class="tcard-name">${esc(m.tool)}</span><span class="tcard-st">running...</span><span>&#9656;</span></div><div class="tcard-body"></div>`;
    messagesEl.appendChild(card);card.scrollIntoView({behavior:'smooth'});
  }else if(m.type==='tool_result'){
    const card=$('#tc_'+m.id);
    if(card){
      const st=card.querySelector('.tcard-st');
      const body=card.querySelector('.tcard-body');
      st.textContent=m.error?'error':'done';
      st.style.color=m.error?'var(--red)':'var(--green)';
      if(body&&m.output)body.textContent=m.output;
    }
  }else if(m.type==='permission_request'){
    const el=document.createElement('div');
    el.className='pcard';
    el.innerHTML=`<div class="pcard-title">Permission: ${esc(m.tool)}</div><div class="pcard-desc">${esc(JSON.stringify(m.input||{}).slice(0,200))}</div><div class="pcard-btns"><button class="pbtn pbtn-ok" onclick="permReply('${m.id}',true,this.parentElement.parentElement)">Allow</button><button class="pbtn pbtn-no" onclick="permReply('${m.id}',false,this.parentElement.parentElement)">Deny</button></div>`;
    messagesEl.appendChild(el);el.scrollIntoView({behavior:'smooth'});
  }
}
function permReply(id,allowed,el){
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'permission_response',id,allowed}));
  el.innerHTML=`<div style="font-size:12px;font-weight:600;color:${allowed?'var(--green)':'var(--red)'}">${allowed?'Allowed':'Denied'}</div>`;
}

function addProject(){
  const name=prompt('Project name:');
  if(!name)return;
  projects.push({id:'p'+Date.now(),name,short:name.slice(0,2).toUpperCase(),color:'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0'),sessions:[]});
  renderAvatars();renderHome();
}

/* ── Boot ── */
renderAvatars();
renderHome();
connectWS();
</script>
