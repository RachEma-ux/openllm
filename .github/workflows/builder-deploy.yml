name: Builder Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (auto = auto-increment, or specify like 1.0.0)'
        required: false
        default: 'auto'
      run_app:
        description: 'Start app with public URL after deploy?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      duration:
        description: 'How long to keep app running (minutes)'
        required: true
        default: '15'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '30'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Reset Gist status to pending
        run: |
          echo "🔄 Resetting Gist tunnel status..."
          GIST_ID="${{ vars.TUNNEL_GIST_ID }}"
          GIST_TOKEN="${{ secrets.GIST_TOKEN }}"

          if [ -n "$GIST_TOKEN" ] && [ -n "$GIST_ID" ]; then
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            GIST_JSON=$(jq -n \
              --arg rid "${{ github.run_id }}" \
              --arg repo "${{ github.repository }}" \
              --arg ts "$TIMESTAMP" \
              '{tunnel_url: null, version: null, run_id: $rid, repository: $repo, status: "pending", started_at: $ts, deploy_type: null}')

            PAYLOAD=$(jq -n --arg content "$GIST_JSON" '{files: {"tunnel-status.json": {content: $content}}}')

            curl -s -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$PAYLOAD" > /dev/null && echo "✅ Gist reset to pending" || echo "⚠️ Gist reset failed"
          else
            echo "⚠️ GIST_TOKEN or TUNNEL_GIST_ID not configured"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          INPUT_VERSION="${INPUT_VERSION#v}"

          if echo "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "📦 Redeploying existing version: v${INPUT_VERSION}"
            echo "VERSION=${INPUT_VERSION}" >> $GITHUB_OUTPUT
            echo "REDEPLOY=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔍 Auto-detecting latest version and incrementing..."
          LATEST=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)

          if [ -z "$LATEST" ]; then
            NEW_VERSION="1.0.0"
            echo "📦 No existing releases → Starting at v${NEW_VERSION}"
          else
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "📦 Latest: v${LATEST} → New: v${NEW_VERSION}"
          fi

          echo "VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "REDEPLOY=false" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      # ========== BUILD PHASE ==========
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          bun install --frozen-lockfile

      - name: Build application
        run: |
          echo "🔨 Building application..."
          bun run build
          if [ ! -f dist/cli.mjs ]; then
            echo "❌ Build completed but dist/cli.mjs is missing"
            ls -lh dist/ || true
            exit 1
          fi

      - name: Stage UI assets
        run: |
          echo "🎨 Staging web UI assets..."
          rm -rf dist/public
          cp -r src/web/public dist/public
          if [ ! -f dist/public/index.html ]; then
            echo "❌ dist/public/index.html missing after stage"
            exit 1
          fi

      # ========== PACK PHASE ==========
      - name: Create pack structure
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACK_NAME="openllm"
          PACK_DIR="pack-output"

          echo "📁 Creating pack structure..."
          mkdir -p "$PACK_DIR"

          cp dist/cli.mjs "$PACK_DIR/" 2>/dev/null || true
          cp -r dist/public "$PACK_DIR/public" 2>/dev/null || true

          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg id "$PACK_NAME" \
            --arg version "$VERSION" \
            --arg sha "${{ github.sha }}" \
            --arg time "$BUILD_TIME" \
            '{
              pack_version: 1,
              id: $id,
              name: "OpenLLM",
              version: $version,
              type: "agent",
              entry: "cli.mjs",
              description: "Claude Code opened to any LLM (ollama / openai-compatible)",
              build: {
                git_sha: $sha,
                built_at: $time,
                runtime: "bun",
                bun_version: "1.3.11"
              },
              scripts: {
                start: "bun cli.mjs serve 5000",
                health: "/api/health"
              }
            }' > "$PACK_DIR/pack.json"

          cat "$PACK_DIR/pack.json"

      - name: Generate checksums
        run: |
          cd pack-output
          find . -type f ! -name "checksums.sha256" -exec sha256sum {} \; > checksums.sha256

      - name: Create pack archive
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACK_NAME="openllm"
          ARCHIVE_NAME="pack-${PACK_NAME}-v${VERSION}.zip"

          cd pack-output
          zip -r "../$ARCHIVE_NAME" .
          cd ..

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "📦 Created: $ARCHIVE_NAME ($(du -h "$ARCHIVE_NAME" | cut -f1))"

      # ========== RELEASE PHASE ==========
      - name: Delete existing release
        continue-on-error: true
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}" \
            | jq -r '.id // empty')

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Deleting existing release v${VERSION}..."
            curl -X DELETE -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}"
            curl -X DELETE -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/v${VERSION}" || true
          fi

      - name: Generate release checksum
        run: |
          sha256sum "${{ env.ARCHIVE_NAME }}" > checksums.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "OpenLLM v${VERSION}" \
            --notes "$(cat <<EOF
          ## OpenLLM v${VERSION}

          **Automated deployment from Builder**

          ### Build Info
          - Git SHA: ${{ github.sha }}
          - Runtime: Bun 1.3.11
          - Built: $(date -u +"%Y-%m-%d %H:%M UTC")
          EOF
          )" \
            "${{ env.ARCHIVE_NAME }}" \
            "checksums.sha256"

      # ========== RUN PHASE (Optional) ==========
      - name: Install Ollama and pull model
        if: ${{ github.event.inputs.run_app == 'yes' }}
        continue-on-error: true
        run: |
          echo "🦙 Installing Ollama..."
          for i in 1 2 3; do
            curl -fsSL https://ollama.com/install.sh | sh && break
            echo "⚠️ Ollama install attempt $i failed, retrying in 10s..."
            sleep 10
          done

          echo "🦙 Starting Ollama server for model pull..."
          ollama serve &
          OLLAMA_PID=$!
          sleep 5

          echo "🦙 Pulling llama3.2:3b..."
          ollama pull llama3.2:3b

          echo "🦙 Available models:"
          ollama list

          kill $OLLAMA_PID 2>/dev/null || true
          sleep 2

      - name: Install cloudflared
        if: ${{ github.event.inputs.run_app == 'yes' }}
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start application with tunnel
        if: ${{ github.event.inputs.run_app == 'yes' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail

          echo "🚀 Starting application..."

          # Start Ollama server (model already pulled)
          OLLAMA_PID=""
          if command -v ollama &>/dev/null; then
            echo "🦙 Starting Ollama server..."
            ollama serve &
            OLLAMA_PID=$!
            sleep 3

            # Wait for the daemon to answer /api/tags, then warm up the
            # model with a dummy generation + keep_alive=30m. Without this
            # warm-up the first real chat message triggers a cold mmap
            # load of llama3.2:3b (~20s on a CPU-only GitHub runner),
            # which takes longer than the WebSocket idle timeout — the
            # client disconnects before any token is streamed back.
            for wait_attempt in 1 2 3 4 5; do
              if curl -fsS --max-time 3 http://localhost:11434/api/tags > /dev/null 2>&1; then
                echo "🦙 Ollama daemon up (attempt $wait_attempt)"
                break
              fi
              sleep 2
            done

            echo "🦙 Warming up llama3.2:3b (keep_alive=30m)..."
            WARMUP_START=$(date +%s)
            if curl -fsS --max-time 120 http://localhost:11434/api/generate \
                -H 'Content-Type: application/json' \
                -d '{"model":"llama3.2:3b","prompt":"hi","stream":false,"keep_alive":"30m"}' \
                > /tmp/ollama-warmup.log 2>&1; then
              WARMUP_END=$(date +%s)
              echo "🦙 Warm-up complete in $(( WARMUP_END - WARMUP_START ))s — model hot for 30m"
            else
              echo "⚠️ Ollama warm-up failed (non-fatal — chat will still work but first message will be slow)"
              tail -20 /tmp/ollama-warmup.log 2>/dev/null || true
            fi
          else
            echo "⚠️ Ollama not available — skipping local LLM"
          fi

          # Provider routing — Claude Code OpenAI-compatible transport.
          # CLAUDE_CODE_USE_OPENAI=1 is REQUIRED; without it the agent
          # throws "ANTHROPIC_API_KEY required" on the first chat message
          # because CI=true enters the Anthropic-auth branch.
          export CLAUDE_CODE_USE_OPENAI=1
          export OPENAI_BASE_URL="http://localhost:11434/v1"
          export OPENAI_API_KEY="dummy-ollama-no-auth"
          export OPENAI_MODEL="llama3.2:3b"
          export OPENLLM_PROVIDER="ollama"
          export OPENLLM_MODEL="llama3.2:3b"

          # Launch the full agent. MUST be `bun`, not `node` — src/web/server.ts
          # uses Bun-native APIs (import.meta.dir, Bun.file, Bun.serve).
          echo "Launching: bun dist/cli.mjs serve 5000"
          bun dist/cli.mjs serve 5000 > server.log 2>&1 &
          SERVER_PID=$!

          echo "⏳ Waiting for server to pass health checks..."
          HEALTH_OK="false"
          for attempt in $(seq 1 18); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "❌ Server exited before startup completed"
              echo "----- server.log -----"
              cat server.log || true
              exit 1
            fi

            if curl -fsS http://localhost:5000/api/health > health.log 2>&1; then
              HEALTH_OK="true"
              echo "✅ Health check passed on attempt $attempt"
              cat health.log
              break
            fi

            echo "⌛ Health check attempt $attempt/18 failed; retrying..."
            sleep 5
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "❌ Server did not become healthy on localhost:5000"
            echo "----- health.log -----"
            cat health.log || true
            echo "----- server.log -----"
            cat server.log || true
            exit 1
          fi

          # Start tunnel
          echo "🌐 Starting Cloudflare tunnel..."
          ./cloudflared tunnel --url http://localhost:5000 2>&1 | tee tunnel.log &
          TUNNEL_PID=$!

          # Wait for tunnel URL and verify the tunnel process is still alive.
          TUNNEL_URL=""
          for attempt in $(seq 1 12); do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "❌ Cloudflare tunnel exited before publishing a URL"
              echo "----- tunnel.log -----"
              cat tunnel.log || true
              exit 1
            fi

            TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              echo "✅ Tunnel URL published on attempt $attempt"
              break
            fi

            echo "⌛ Waiting for tunnel URL ($attempt/12)..."
            sleep 5
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Tunnel URL was not published"
            echo "----- tunnel.log -----"
            cat tunnel.log || true
            exit 1
          fi

          echo ""
          echo "============================================"
          echo "🎉 DEPLOYMENT COMPLETE!"
          echo "============================================"
          echo ""
          echo "📦 Version: v${{ steps.version.outputs.VERSION }}"
          echo "🌐 URL: $TUNNEL_URL"
          echo "🔎 Health: $TUNNEL_URL/api/health"
          echo ""
          echo "⏱️  Running for ${{ github.event.inputs.duration }} minutes"
          echo "============================================"

          # Save URL
          echo "$TUNNEL_URL" > app_url.txt

          # Update Gist with tunnel URL
          echo "📤 Updating Gist with tunnel URL..."
          GIST_ID="${{ vars.TUNNEL_GIST_ID }}"
          GIST_TOKEN="${{ secrets.GIST_TOKEN }}"

          if [ -n "$GIST_TOKEN" ] && [ -n "$GIST_ID" ]; then
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            IS_REDEPLOY="${{ steps.version.outputs.REDEPLOY }}"
            DEPLOY_TYPE="new"
            if [ "$IS_REDEPLOY" = "true" ]; then
              DEPLOY_TYPE="redeploy"
            fi
            GIST_JSON=$(jq -n \
              --arg url "$TUNNEL_URL" \
              --arg ver "${{ steps.version.outputs.VERSION }}" \
              --arg rid "${{ github.run_id }}" \
              --arg repo "${{ github.repository }}" \
              --arg dur "${{ github.event.inputs.duration }}" \
              --arg ts "$TIMESTAMP" \
              --arg deployType "$DEPLOY_TYPE" \
              '{tunnel_url: $url, version: $ver, run_id: $rid, repository: $repo, status: "running", duration_minutes: ($dur|tonumber), started_at: $ts, deploy_type: $deployType}')

            PAYLOAD=$(jq -n --arg content "$GIST_JSON" '{files: {"tunnel-status.json": {content: $content}}}')

            curl -s -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$PAYLOAD" > /dev/null && echo "✅ Gist updated" || echo "⚠️ Gist update failed"
          else
            echo "⚠️ GIST_TOKEN or TUNNEL_GIST_ID not configured, skipping Gist update"
          fi

          # Keep running
          DURATION_SECONDS=$(( ${{ github.event.inputs.duration }} * 60 ))
          sleep $DURATION_SECONDS

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
          kill $TUNNEL_PID 2>/dev/null || true
          [ -n "$OLLAMA_PID" ] && kill $OLLAMA_PID 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-v${{ steps.version.outputs.VERSION }}
          path: |
            app_url.txt
            server.log
            health.log
            tunnel.log
            pack-output/pack.json
            ${{ env.ARCHIVE_NAME }}
          retention-days: 7

      - name: Deployment Summary
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          echo "## 🚀 OpenLLM Builder Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | v${VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| Archive | ${{ env.ARCHIVE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | [v${VERSION}](https://github.com/${{ github.repository }}/releases/tag/v${VERSION}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.run_app }}" = "yes" ] && [ -f app_url.txt ]; then
            TUNNEL_URL=$(cat app_url.txt)
            echo "### Live Application" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **URL:** ${TUNNEL_URL}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "App will be available for ${{ github.event.inputs.duration }} minutes." >> $GITHUB_STEP_SUMMARY
          fi
