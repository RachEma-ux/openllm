name: Builder Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (auto = auto-increment, or specify like 1.0.0)'
        required: false
        default: 'auto'
      run_app:
        description: 'Start app with public URL after build?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      duration:
        description: 'How long to keep app running (minutes)'
        required: true
        default: '15'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '30'
      provider:
        description: 'Default LLM provider to configure'
        required: false
        default: 'ollama'
        type: choice
        options:
          - 'ollama'
          - 'openai'
          - 'gemini'
          - 'anthropic'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ========== GIST STATUS ==========
      - name: Reset Gist status to pending
        run: |
          echo "Resetting Gist tunnel status..."
          GIST_ID="${{ vars.TUNNEL_GIST_ID }}"
          GIST_TOKEN="${{ secrets.GIST_TOKEN }}"

          if [ -n "$GIST_TOKEN" ] && [ -n "$GIST_ID" ]; then
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            GIST_JSON=$(jq -n \
              --arg rid "${{ github.run_id }}" \
              --arg repo "${{ github.repository }}" \
              --arg ts "$TIMESTAMP" \
              '{tunnel_url: null, version: null, run_id: $rid, repository: $repo, status: "pending", started_at: $ts}')

            PAYLOAD=$(jq -n --arg content "$GIST_JSON" '{files: {"tunnel-status.json": {content: $content}}}')

            curl -s -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$PAYLOAD" > /dev/null && echo "Gist reset to pending" || echo "Gist reset failed"
          else
            echo "GIST_TOKEN or TUNNEL_GIST_ID not configured — skipping"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========== VERSION ==========
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          INPUT_VERSION="${INPUT_VERSION#v}"

          if echo "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Redeploying existing version: v${INPUT_VERSION}"
            echo "VERSION=${INPUT_VERSION}" >> $GITHUB_OUTPUT
            echo "REDEPLOY=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LATEST=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)

          if [ -z "$LATEST" ]; then
            NEW_VERSION="1.0.0"
            echo "No existing releases — starting at v${NEW_VERSION}"
          else
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "Latest: v${LATEST} — New: v${NEW_VERSION}"
          fi

          echo "VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "REDEPLOY=false" >> $GITHUB_OUTPUT

      # ========== SETUP ==========
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      # ========== BUILD ==========
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run smoke tests
        run: bun run smoke
        continue-on-error: true

      - name: Run unit tests
        run: bun test --max-concurrency=1
        continue-on-error: true

      - name: Build application
        run: |
          echo "Building OpenLLM..."
          bun run build
          echo "Build output:"
          ls -lh dist/

      # ========== REBRAND ==========
      - name: Rebrand to OpenLLM
        run: |
          # Update package name
          if [ -f package.json ]; then
            jq '.name = "@rachelma/openllm" | .bin.openllm = .bin.openclaude | del(.bin.openclaude)' package.json > package.tmp && mv package.tmp package.json
          fi

          # Update bin script
          if [ -f bin/openclaude ]; then
            cp bin/openclaude bin/openllm
            chmod +x bin/openllm
          fi

          echo "Rebranded to OpenLLM"

      # ========== PACK ==========
      - name: Create pack archive
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACK_DIR="pack-output"

          mkdir -p "$PACK_DIR"

          # Copy build output
          cp -r dist "$PACK_DIR/"
          cp -r bin "$PACK_DIR/"
          cp package.json "$PACK_DIR/"
          cp README.md "$PACK_DIR/" 2>/dev/null || true
          cp LICENSE "$PACK_DIR/" 2>/dev/null || true

          # Create pack manifest
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg version "$VERSION" \
            --arg sha "${{ github.sha }}" \
            --arg time "$BUILD_TIME" \
            '{
              pack_version: 1,
              id: "openllm",
              name: "OpenLLM",
              version: $version,
              description: "Claude Code opened to any LLM — OpenAI, Gemini, DeepSeek, Ollama, and 200+ models",
              entry: "dist/cli.mjs",
              build: {
                git_sha: $sha,
                built_at: $time,
                node_version: "22",
                bun_version: "1.3.11"
              },
              providers: ["openai", "anthropic", "gemini", "ollama", "deepseek", "groq", "together", "fireworks"],
              scripts: {
                start: "node dist/cli.mjs",
                dev: "bun run dev"
              }
            }' > "$PACK_DIR/pack.json"

          # Checksums
          cd "$PACK_DIR"
          find . -type f ! -name "checksums.sha256" -exec sha256sum {} \; > checksums.sha256
          cd ..

          # Archive
          ARCHIVE_NAME="pack-openllm-v${VERSION}.zip"
          cd "$PACK_DIR" && zip -r "../$ARCHIVE_NAME" . && cd ..

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "Created: $ARCHIVE_NAME ($(du -h "$ARCHIVE_NAME" | cut -f1))"

      # ========== RELEASE ==========
      - name: Delete existing release
        continue-on-error: true
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}" \
            | jq -r '.id // empty')

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Deleting existing release v${VERSION}..."
            curl -X DELETE -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}"
            curl -X DELETE -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/v${VERSION}" || true
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          sha256sum "${{ env.ARCHIVE_NAME }}" > checksums.sha256

          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "OpenLLM v${VERSION}" \
            --notes "$(cat <<EOF
          ## OpenLLM v${VERSION}

          Claude Code opened to any LLM — OpenAI, Gemini, DeepSeek, Ollama, and 200+ models.

          ### Build Info
          - Git SHA: \`${{ github.sha }}\`
          - Node: 22 / Bun: 1.3.11
          - Built: $(date -u +"%Y-%m-%d %H:%M UTC")

          ### Installation
          \`\`\`bash
          # From release
          wget https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${{ env.ARCHIVE_NAME }}
          unzip ${{ env.ARCHIVE_NAME }} -d openllm
          cd openllm && node dist/cli.mjs

          # Or run directly
          npx @rachelma/openllm
          \`\`\`

          ### Supported Providers
          OpenAI, Anthropic, Google Gemini, Ollama, DeepSeek, Groq, Together, Fireworks, and 200+ more via OpenAI-compatible endpoints.
          EOF
          )" \
            "${{ env.ARCHIVE_NAME }}" \
            "checksums.sha256"

          echo "Release v${VERSION} created!"

      # ========== RUN PHASE ==========
      - name: Install Ollama
        if: ${{ github.event.inputs.run_app == 'yes' && github.event.inputs.provider == 'ollama' }}
        continue-on-error: true
        run: |
          echo "Installing Ollama..."
          for i in 1 2 3; do
            curl -fsSL https://ollama.com/install.sh | sh && break
            echo "Ollama install attempt $i failed, retrying..."
            sleep 10
          done

          ollama serve &
          sleep 5

          echo "Pulling models..."
          ollama pull llama3.2:3b || ollama pull tinyllama
          echo "Available models:"
          ollama list

      - name: Install localtunnel
        if: ${{ github.event.inputs.run_app == 'yes' }}
        run: |
          # localtunnel replaces cloudflared. Cloudflare QuickTunnels
          # (trycloudflare.com) route through Workers, which cannot
          # proxy HTTP 101 (WebSocket upgrade) responses — so the chat
          # UI's wss:// connection always fails on QuickTunnel URLs.
          # localtunnel supports WebSocket upgrades natively.
          npm install -g localtunnel
          lt --version || true

      - name: Start application with tunnel
        if: ${{ github.event.inputs.run_app == 'yes' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.VERSION }}"
          PROVIDER="${{ github.event.inputs.provider }}"

          echo "Starting OpenLLM FULL AGENT (mandatory, no fallback) with provider: $PROVIDER"

          # ── Create workspace with git context (QueryEngine needs it) ──
          mkdir -p /tmp/openllm-workspace
          cd /tmp/openllm-workspace
          git init
          git config user.email "deploy@openllm.dev"
          git config user.name "OpenLLM Deploy"
          echo "# OpenLLM Workspace" > README.md
          git add . && git commit -m "init"

          # ── Configure provider ──
          # CRITICAL: Claude Code's auth layer (src/utils/auth.ts) only
          # recognizes CLAUDE_CODE_USE_* flags for 3P provider detection.
          # Setting OPENLLM_PROVIDER alone is not enough — when CI=true
          # (GitHub Actions sets this), auth.ts throws
          # "ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN env var is required"
          # unless one of the CLAUDE_CODE_USE_* flags is true.
          if [ "$PROVIDER" = "ollama" ]; then
            # Route through Claude Code's OpenAI-compatible transport
            export CLAUDE_CODE_USE_OPENAI=1
            export OPENAI_BASE_URL="http://localhost:11434/v1"
            export OPENAI_API_BASE="http://localhost:11434/v1"
            export OPENAI_MODEL="llama3.2:3b"
            # Ollama doesn't check the API key but the SDK refuses empty
            export OPENAI_API_KEY="ollama-local-no-auth-required"
            # OpenLLM-native config (read by web server UI layer)
            export OPENLLM_PROVIDER="ollama"
            export OPENLLM_MODEL="llama3.2:3b"
            export OPENLLM_BASE_URL="http://localhost:11434/v1"
          elif [ "$PROVIDER" = "openai" ]; then
            export CLAUDE_CODE_USE_OPENAI=1
            export OPENLLM_PROVIDER="openai"
            export OPENLLM_MODEL="${OPENAI_MODEL:-gpt-4o}"
          elif [ "$PROVIDER" = "gemini" ]; then
            export CLAUDE_CODE_USE_GEMINI=1
            export OPENLLM_PROVIDER="gemini"
            export OPENLLM_MODEL="gemini-2.0-flash"
            export GOOGLE_API_KEY="$GEMINI_API_KEY"
          elif [ "$PROVIDER" = "anthropic" ]; then
            export OPENLLM_PROVIDER="anthropic"
            export OPENLLM_MODEL="claude-sonnet-4-5-20241022"
          fi

          # ── Start the FULL agent (Bun + QueryEngine + tools) ──
          # MUST use bun (not node): src/web/server.ts uses Bun-native APIs
          # (import.meta.dir, Bun.file, Bun.serve). Running the bundle under
          # node crashes immediately with "paths[0] must be of type string".
          # Port 5000 is the documented default for the OpenLLM web server
          # (src/web/types.ts: "Range: 5000–5999"). Do not use 3000.
          cd "$GITHUB_WORKSPACE"

          # ── SENTINEL v1 — live app-log streaming ──
          # Every byte the OpenLLM process writes (including all
          # [sentinel] events injected into server.ts, ws-bridge.ts,
          # client.ts, toolExecution.ts, and auth.ts) ends up in
          # server.log via the stdout redirect a few lines below.
          # Sentinel pre-creates the file and tails it to this step's
          # stdout with an SENTINEL prefix so every event appears live
          # in the GitHub Actions workflow log AND is persisted as an
          # artifact after the run (via the existing Upload artifacts
          # step which already includes server.log).
          : > server.log
          ( tail -F server.log 2>/dev/null ) &
          SENTINEL_PID=$!
          echo "SENTINEL: live log tail started (pid=$SENTINEL_PID)"

          # server.ts resolves PUBLIC_DIR via `resolve(import.meta.dir,
          # 'public')`. Inside the bundled dist/cli.mjs this becomes
          # dist/public, which bun run build does NOT create. Without
          # this copy the UI shows "Web UI not installed yet". Proper
          # fix belongs in the build step (package.json postbuild) —
          # tracked separately.
          echo "Staging web UI assets into dist/public..."
          rm -rf dist/public
          cp -r src/web/public dist/public
          ls -lh dist/public/ | head -20

          echo "Launching: bun dist/cli.mjs serve 5000"
          OPENLLM_WEB_PORT=5000 \
            bun dist/cli.mjs serve 5000 > server.log 2>&1 &
          SERVER_PID=$!

          # ── Wait for health (QueryEngine takes longer to init) ──
          # FULL AGENT ONLY — no fallback to chat relay. If the full agent
          # (dist/cli.mjs serve) cannot start, the deploy must fail loudly so
          # we know tools/skills are unavailable rather than serving a dumb
          # chat relay that silently drops /skill and /run-skill commands.
          echo "Waiting for full agent to start (up to 180s)..."
          HEALTH_OK="false"
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5000/api/health > /dev/null 2>&1; then
              HEALTH_OK="true"
              echo "Full agent healthy on attempt $attempt"
              break
            fi
            sleep 3
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "============================================"
            echo "  FATAL: Full agent did not become healthy"
            echo "============================================"
            echo "Deploy policy: full-agent-only (no chat-relay fallback)."
            echo "Dumping server.log for diagnosis:"
            echo "--------------------------------------------"
            cat server.log || true
            echo "--------------------------------------------"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # ── Verify the agent actually has tools (not a chat relay) ──
          echo "Verifying full-agent capabilities..."
          HEALTH_BODY=$(curl -fsS http://localhost:5000/api/health || echo '{}')
          echo "Health response: $HEALTH_BODY"
          if echo "$HEALTH_BODY" | grep -qi '"mode"[[:space:]]*:[[:space:]]*"chat-relay"'; then
            echo "FATAL: Health endpoint reports chat-relay mode — full agent not running."
            cat server.log || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "Full agent healthy and tool-capable."

          # ── Start localtunnel (with retry loop) ──
          # localtunnel supports WebSocket upgrades (HTTP 101), unlike
          # Cloudflare QuickTunnels. URL format: https://xxx.loca.lt
          # On first visit, browsers see an interstitial asking for the
          # "tunnel password" which is the runner's public egress IP —
          # we print it below so the user can copy/paste.
          TUNNEL_URL=""
          TUNNEL_PID=""
          TUNNEL_MAX_ATTEMPTS=3
          TUNNEL_BACKOFF=10

          # Fetch runner's public IP (used as localtunnel password prompt)
          RUNNER_IP=$(curl -fsS --max-time 5 https://ipv4.icanhazip.com 2>/dev/null | tr -d '[:space:]' || echo "unknown")
          echo "Runner public IP (localtunnel password): $RUNNER_IP"

          for tunnel_try in $(seq 1 $TUNNEL_MAX_ATTEMPTS); do
            echo "============================================"
            echo "  localtunnel attempt $tunnel_try of $TUNNEL_MAX_ATTEMPTS"
            echo "============================================"

            # Clean slate: fresh log file, kill any prior lt
            if [ -n "$TUNNEL_PID" ]; then
              kill $TUNNEL_PID 2>/dev/null || true
              wait $TUNNEL_PID 2>/dev/null || true
            fi
            : > tunnel.log

            # lt prints "your url is: https://xxx.loca.lt" on startup
            lt --port 5000 --print-requests 2>&1 | tee tunnel.log &
            TUNNEL_PID=$!

            # Poll tunnel.log for the loca.lt URL (up to 60s per attempt)
            for poll in $(seq 1 12); do
              TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.loca\.lt' tunnel.log | head -1 || true)
              if [ -n "$TUNNEL_URL" ]; then
                echo "Tunnel URL acquired on try $tunnel_try (poll $poll): $TUNNEL_URL"
                break 2
              fi
              sleep 5
            done

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            echo "Attempt $tunnel_try failed. Last 20 lines of tunnel.log:"
            tail -20 tunnel.log || true

            if [ $tunnel_try -lt $TUNNEL_MAX_ATTEMPTS ]; then
              echo "Backing off ${TUNNEL_BACKOFF}s before next attempt..."
              sleep $TUNNEL_BACKOFF
              TUNNEL_BACKOFF=$(( TUNNEL_BACKOFF * 2 ))
            fi
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "============================================"
            echo "  FATAL: localtunnel never published a URL"
            echo "  after $TUNNEL_MAX_ATTEMPTS attempts."
            echo "============================================"
            cat tunnel.log || true
            exit 1
          fi

          echo ""
          echo "============================================"
          echo "  IMPORTANT: first-visit interstitial"
          echo "  On your first visit, localtunnel will ask"
          echo "  for a 'tunnel password'. Enter: $RUNNER_IP"
          echo "============================================"

          echo ""
          echo "============================================"
          echo "  DEPLOYMENT COMPLETE!"
          echo "============================================"
          echo ""
          echo "  Version:  v${VERSION}"
          echo "  URL:      $TUNNEL_URL"
          echo "  Provider: $PROVIDER"
          echo "  Mode:     FULL AGENT (QueryEngine + 51 tools)"
          echo "  UI:       Home + Chat (WebSocket streaming)"
          echo "  Duration: ${{ github.event.inputs.duration }} minutes"
          echo "============================================"

          echo "$TUNNEL_URL" > "$GITHUB_WORKSPACE/app_url.txt"

          # ── Update Gist ──
          GIST_ID="${{ vars.TUNNEL_GIST_ID }}"
          GIST_TOKEN="${{ secrets.GIST_TOKEN }}"

          if [ -n "$GIST_TOKEN" ] && [ -n "$GIST_ID" ]; then
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            GIST_JSON=$(jq -n \
              --arg url "$TUNNEL_URL" \
              --arg ver "${VERSION}" \
              --arg rid "${{ github.run_id }}" \
              --arg repo "${{ github.repository }}" \
              --arg dur "${{ github.event.inputs.duration }}" \
              --arg ts "$TIMESTAMP" \
              --arg prov "$PROVIDER" \
              --arg ltpwd "$RUNNER_IP" \
              '{tunnel_url: $url, version: $ver, run_id: $rid, repository: $repo, status: "running", duration_minutes: ($dur|tonumber), started_at: $ts, provider: $prov, tunnel_password: $ltpwd}')

            PAYLOAD=$(jq -n --arg content "$GIST_JSON" '{files: {"tunnel-status.json": {content: $content}}}')

            curl -s -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$PAYLOAD" > /dev/null && echo "Gist updated" || echo "Gist update failed"
          fi

          # ── Keep running for duration ──
          DURATION_SECONDS=$(( ${{ github.event.inputs.duration }} * 60 ))
          echo "Serving for ${DURATION_SECONDS}s..."
          sleep $DURATION_SECONDS

          # ── Cleanup ──
          kill $SERVER_PID 2>/dev/null || true
          kill $TUNNEL_PID 2>/dev/null || true
          kill $SENTINEL_PID 2>/dev/null || true

      # ========== ARTIFACTS ==========
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openllm-v${{ steps.version.outputs.VERSION }}
          path: |
            app_url.txt
            server.log
            tunnel.log
            pack-output/pack.json
            ${{ env.ARCHIVE_NAME }}
          retention-days: 7

      - name: Deployment Summary
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          echo "## OpenLLM Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | v${VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| Archive | ${{ env.ARCHIVE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Provider | ${{ github.event.inputs.provider }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | [v${VERSION}](https://github.com/${{ github.repository }}/releases/tag/v${VERSION}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.run_app }}" = "yes" ] && [ -f app_url.txt ]; then
            TUNNEL_URL=$(cat app_url.txt)
            echo "### Live Application" >> $GITHUB_STEP_SUMMARY
            echo "URL: ${TUNNEL_URL}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Running for ${{ github.event.inputs.duration }} minutes." >> $GITHUB_STEP_SUMMARY
          fi
