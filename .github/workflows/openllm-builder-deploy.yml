name: OpenLLM Builder Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (auto = auto-increment, or specify like 1.0.0)'
        required: false
        default: 'auto'
      run_app:
        description: 'Start app with public URL after deploy?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      duration:
        description: 'How long to keep app running (minutes)'
        required: true
        default: '15'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '30'

permissions:
  contents: write
  actions: write

concurrency:
  group: openllm-builder-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Reset Gist status to pending
        run: |
          echo "🔄 Resetting Gist tunnel status..."
          GIST_ID="${{ vars.TUNNEL_GIST_ID }}"
          GIST_TOKEN="${{ secrets.GIST_TOKEN }}"

          if [ -n "$GIST_TOKEN" ] && [ -n "$GIST_ID" ]; then
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            GIST_JSON=$(jq -n \
              --arg rid "${{ github.run_id }}" \
              --arg repo "${{ github.repository }}" \
              --arg ts "$TIMESTAMP" \
              '{tunnel_url: null, version: null, run_id: $rid, repository: $repo, status: "pending", started_at: $ts, deploy_type: null}')

            PAYLOAD=$(jq -n --arg content "$GIST_JSON" '{files: {"tunnel-status.json": {content: $content}}}')

            curl -s -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$PAYLOAD" > /dev/null && echo "✅ Gist reset to pending" || echo "⚠️ Gist reset failed"
          else
            echo "⚠️ GIST_TOKEN or TUNNEL_GIST_ID not configured"
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          INPUT_VERSION="${INPUT_VERSION#v}"

          if echo "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "📦 Redeploying existing version: v${INPUT_VERSION}"
            echo "VERSION=${INPUT_VERSION}" >> $GITHUB_OUTPUT
            echo "REDEPLOY=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔍 Auto-detecting latest version and incrementing..."
          LATEST=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)

          if [ -z "$LATEST" ]; then
            NEW_VERSION="1.0.0"
            echo "📦 No existing releases → Starting at v${NEW_VERSION}"
          else
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "📦 Latest: v${LATEST} → New: v${NEW_VERSION}"
          fi

          echo "VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "REDEPLOY=false" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: '1.3.11'

      # ========== BUILD PHASE ==========
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          bun install --frozen-lockfile

      - name: Build application
        run: |
          echo "🔨 Building application..."
          bun run build
          if [ ! -f dist/cli.mjs ]; then
            echo "❌ Build completed but dist/cli.mjs is missing"
            ls -lh dist/ || true
            exit 1
          fi

      - name: Stage UI assets
        run: |
          echo "🎨 Staging web UI assets..."
          rm -rf dist/public
          cp -r src/web/public dist/public
          if [ ! -f dist/public/index.html ]; then
            echo "❌ dist/public/index.html missing after stage"
            exit 1
          fi

      # ========== PACK PHASE ==========
      - name: Create pack structure
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACK_NAME="openllm"
          PACK_DIR="pack-output"

          echo "📁 Creating pack structure..."
          mkdir -p "$PACK_DIR"

          cp dist/cli.mjs "$PACK_DIR/" 2>/dev/null || true
          cp -r dist/public "$PACK_DIR/public" 2>/dev/null || true

          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg id "$PACK_NAME" \
            --arg version "$VERSION" \
            --arg sha "${{ github.sha }}" \
            --arg time "$BUILD_TIME" \
            '{
              pack_version: 1,
              id: $id,
              name: "OpenLLM",
              version: $version,
              type: "agent",
              entry: "cli.mjs",
              description: "Claude Code opened to any LLM (ollama / openai-compatible)",
              build: {
                git_sha: $sha,
                built_at: $time,
                runtime: "bun",
                bun_version: "1.3.11"
              },
              scripts: {
                start: "bun cli.mjs serve 5000",
                health: "/api/health"
              }
            }' > "$PACK_DIR/pack.json"

          cat "$PACK_DIR/pack.json"

      - name: Generate checksums
        run: |
          cd pack-output
          find . -type f ! -name "checksums.sha256" -exec sha256sum {} \; > checksums.sha256

      - name: Create pack archive
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACK_NAME="openllm"
          ARCHIVE_NAME="pack-${PACK_NAME}-v${VERSION}.zip"

          cd pack-output
          zip -r "../$ARCHIVE_NAME" .
          cd ..

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "📦 Created: $ARCHIVE_NAME ($(du -h "$ARCHIVE_NAME" | cut -f1))"

      # ========== RELEASE PHASE ==========
      - name: Delete existing release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          gh release delete "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --yes --cleanup-tag || true

      - name: Generate release checksum
        run: |
          sha256sum "${{ env.ARCHIVE_NAME }}" > checksums.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "OpenLLM v${VERSION}" \
            --notes "$(cat <<EOF
          ## OpenLLM v${VERSION}

          **Automated deployment from Builder**

          ### Build Info
          - Git SHA: ${{ github.sha }}
          - Runtime: Bun 1.3.11
          - Built: $(date -u +"%Y-%m-%d %H:%M UTC")
          EOF
          )" \
            "${{ env.ARCHIVE_NAME }}" \
            "checksums.sha256"

      # ========== RUN PHASE (Optional) ==========
      # Provider/model defaults live in src/web/providers.ts (the single
      # source of truth). The chat relay (src/web/node-server.ts) reads
      # the manifest at boot, exposes it via /api/manifest, and the web
      # UI fetches it on first load. Per-provider API keys come from the
      # env block below; the user can also override per-request by
      # pasting a key into Settings → Provider API Keys (stored in
      # browser localStorage and sent with every chat message).
      #
      # Ollama is installed on the same runner so the relay's localhost
      # ollama provider works end-to-end.

      - name: Install Ollama and pull tinyllama
        if: ${{ github.event.inputs.run_app == 'yes' }}
        continue-on-error: true
        run: |
          echo "🦙 Installing Ollama..."
          for i in 1 2 3; do
            curl -fsSL https://ollama.com/install.sh | sh && break
            echo "⚠️ Ollama install attempt $i failed, retrying in 10s..."
            sleep 10
          done

          echo "🦙 Starting Ollama server for model pull..."
          ollama serve > /tmp/ollama-pull.log 2>&1 &
          OLLAMA_PULL_PID=$!
          sleep 5

          echo "🦙 Pulling tinyllama (~637MB)..."
          ollama pull tinyllama

          echo "🦙 Available models:"
          ollama list

          # Stop the pull-time daemon — the run step restarts it cleanly.
          kill $OLLAMA_PULL_PID 2>/dev/null || true
          sleep 2

      - name: Install cloudflared
        if: ${{ github.event.inputs.run_app == 'yes' }}
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start application with tunnel
        if: ${{ github.event.inputs.run_app == 'yes' }}
        env:
          # Default provider key — required for the out-of-the-box
          # openai / gpt-5.4-mini path. The actual repo secret is
          # MY_PAT (a personal access token that doubles as the OpenAI
          # key on this repo). The other entries below are optional
          # fallbacks for users that select a different provider in
          # the UI without pasting their own key.
          OPENAI_API_KEY: ${{ secrets.MY_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # providers.ts reads GEMINI_API_KEY; the existing repo secret
          # is named GOOGLE_API_KEY, so map it through here.
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail

          echo "🚀 Starting application (defaults from src/web/providers.ts: openai / gpt-5.4-mini)..."
          export OPENLLM_WEB_PORT=5000

          # Start Ollama daemon if it was installed in the previous step.
          # OLLAMA_PID stays empty when ollama isn't available so the
          # cleanup branch at the bottom of this script remains a no-op.
          OLLAMA_PID=""
          if command -v ollama >/dev/null 2>&1; then
            echo "🦙 Starting Ollama server (background)..."
            ollama serve > ollama.log 2>&1 &
            OLLAMA_PID=$!
            sleep 3
            if curl -fsS --max-time 3 http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "✅ Ollama daemon healthy on localhost:11434"
              ollama list || true
            else
              echo "⚠️ Ollama daemon did not respond on localhost:11434 within 3s"
              tail -20 ollama.log 2>/dev/null || true
            fi
          else
            echo "⚠️ ollama binary not found — local provider will be unavailable"
          fi

          echo "Launching: bun src/web/node-server.ts (chat relay, port 5000)"
          bun src/web/node-server.ts > server.log 2>&1 &
          SERVER_PID=$!

          echo "⏳ Waiting for server to pass health checks..."
          HEALTH_OK="false"
          for attempt in $(seq 1 36); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "❌ Server exited before startup completed"
              echo "----- server.log -----"
              cat server.log || true
              exit 1
            fi

            if curl -fsS http://localhost:5000/api/health > health.log 2>&1; then
              HEALTH_OK="true"
              echo "✅ Health check passed on attempt $attempt"
              cat health.log
              break
            fi

            echo "⌛ Health check attempt $attempt/36 failed; retrying..."
            sleep 5
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "❌ Server did not become healthy on localhost:5000"
            echo "----- health.log -----"
            cat health.log || true
            echo "----- server.log -----"
            cat server.log || true
            exit 1
          fi

          # Start tunnel
          echo "🌐 Starting Cloudflare tunnel..."
          ./cloudflared tunnel --url http://localhost:5000 > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          # Wait for tunnel URL and verify the tunnel process is still alive.
          TUNNEL_URL=""
          for attempt in $(seq 1 12); do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "❌ Cloudflare tunnel exited before publishing a URL"
              echo "----- tunnel.log -----"
              cat tunnel.log || true
              exit 1
            fi

            TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              echo "✅ Tunnel URL published on attempt $attempt"
              break
            fi

            echo "⌛ Waiting for tunnel URL ($attempt/12)..."
            sleep 5
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Tunnel URL was not published"
            echo "----- tunnel.log -----"
            cat tunnel.log || true
            exit 1
          fi

          echo ""
          echo "============================================"
          echo "🎉 DEPLOYMENT COMPLETE!"
          echo "============================================"
          echo ""
          echo "📦 Version: v${{ steps.version.outputs.VERSION }}"
          echo "🌐 URL: $TUNNEL_URL"
          echo "🔎 Health: $TUNNEL_URL/api/health"
          echo ""
          echo "⏱️  Running for ${{ github.event.inputs.duration }} minutes"
          echo "============================================"

          # Save URL
          echo "$TUNNEL_URL" > app_url.txt

          # Mark the deploy as successful so the final cleanup step knows
          # that any subsequent timeout/cancellation is "after a successful
          # run" and the workflow run can be deleted from history.
          touch "$RUNNER_TEMP/.deploy-success"

          # Update Gist with tunnel URL
          echo "📤 Updating Gist with tunnel URL..."
          GIST_ID="${{ vars.TUNNEL_GIST_ID }}"
          GIST_TOKEN="${{ secrets.GIST_TOKEN }}"

          if [ -n "$GIST_TOKEN" ] && [ -n "$GIST_ID" ]; then
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            IS_REDEPLOY="${{ steps.version.outputs.REDEPLOY }}"
            DEPLOY_TYPE="new"
            if [ "$IS_REDEPLOY" = "true" ]; then
              DEPLOY_TYPE="redeploy"
            fi
            GIST_JSON=$(jq -n \
              --arg url "$TUNNEL_URL" \
              --arg ver "${{ steps.version.outputs.VERSION }}" \
              --arg rid "${{ github.run_id }}" \
              --arg repo "${{ github.repository }}" \
              --arg dur "${{ github.event.inputs.duration }}" \
              --arg ts "$TIMESTAMP" \
              --arg deployType "$DEPLOY_TYPE" \
              '{tunnel_url: $url, version: $ver, run_id: $rid, repository: $repo, status: "running", duration_minutes: ($dur|tonumber), started_at: $ts, deploy_type: $deployType}')

            PAYLOAD=$(jq -n --arg content "$GIST_JSON" '{files: {"tunnel-status.json": {content: $content}}}')

            curl -s -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$PAYLOAD" > /dev/null && echo "✅ Gist updated" || echo "⚠️ Gist update failed"
          else
            echo "⚠️ GIST_TOKEN or TUNNEL_GIST_ID not configured, skipping Gist update"
          fi

          # Keep running
          DURATION_SECONDS=$(( ${{ github.event.inputs.duration }} * 60 ))
          sleep $DURATION_SECONDS

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
          kill $TUNNEL_PID 2>/dev/null || true
          [ -n "$OLLAMA_PID" ] && kill $OLLAMA_PID 2>/dev/null || true

      - name: Reset Gist status on exit
        if: always()
        run: |
          GIST_ID="${{ vars.TUNNEL_GIST_ID }}"
          GIST_TOKEN="${{ secrets.GIST_TOKEN }}"

          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "⚠️ GIST_TOKEN or TUNNEL_GIST_ID not configured, skipping Gist cleanup"
            exit 0
          fi

          STATUS="stopped"
          if [ "${{ job.status }}" = "failure" ] || [ "${{ job.status }}" = "cancelled" ]; then
            STATUS="failed"
          fi

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GIST_JSON=$(jq -n \
            --arg rid "${{ github.run_id }}" \
            --arg repo "${{ github.repository }}" \
            --arg ts "$TIMESTAMP" \
            --arg status "$STATUS" \
            '{tunnel_url: null, version: null, run_id: $rid, repository: $repo, status: $status, stopped_at: $ts, deploy_type: null}')

          PAYLOAD=$(jq -n --arg content "$GIST_JSON" '{files: {"tunnel-status.json": {content: $content}}}')

          curl -s -X PATCH "https://api.github.com/gists/$GIST_ID" \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$PAYLOAD" > /dev/null && echo "✅ Gist status set to $STATUS" || echo "⚠️ Gist cleanup failed"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: deployment-v${{ steps.version.outputs.VERSION }}
          path: |
            app_url.txt
            server.log
            health.log
            tunnel.log
            ollama.log
            pack-output/pack.json
            ${{ env.ARCHIVE_NAME }}
          retention-days: 7

      - name: Deployment Summary
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          echo "## 🚀 OpenLLM Builder Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | v${VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| Archive | ${{ env.ARCHIVE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | [v${VERSION}](https://github.com/${{ github.repository }}/releases/tag/v${VERSION}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.run_app }}" = "yes" ] && [ -f app_url.txt ]; then
            TUNNEL_URL=$(cat app_url.txt)
            echo "### Live Application" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **URL:** ${TUNNEL_URL}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "App will be available for ${{ github.event.inputs.duration }} minutes." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Delete workflow run after successful deploy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only delete the run if the deploy reached the "tunnel is live"
          # milestone. That way a build/release failure stays visible in
          # Actions history, but a successful run that later times out or
          # is cancelled gets removed automatically.
          if [ ! -f "$RUNNER_TEMP/.deploy-success" ]; then
            echo "ℹ️ Deploy-success marker not set; keeping workflow run."
            exit 0
          fi

          JOB_STATUS="${{ job.status }}"
          if [ "$JOB_STATUS" != "success" ] && [ "$JOB_STATUS" != "cancelled" ]; then
            echo "ℹ️ Job status is '$JOB_STATUS'; keeping workflow run."
            exit 0
          fi

          echo "🗑️  Deploy succeeded (status=$JOB_STATUS). Deleting workflow run ${{ github.run_id }}..."
          # Fire-and-forget in the background so the API call has time to
          # dispatch before the runner is torn down by the deletion.
          (
            sleep 5
            gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              && echo "✅ Workflow run deleted" \
              || echo "⚠️ Failed to delete workflow run"
          ) &
          disown || true
